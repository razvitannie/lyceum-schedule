<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Расписание Лицея БНТУ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f8f9fa);
      --text-color: var(--tg-theme-text-color, #212529);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #6c757d);
      --bntu-primary: #a6192e;
      --border-color: rgba(0, 0, 0, 0.08);
      --input-bg: rgba(0, 0, 0, 0.03);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Модальное окно авторизации */
    #authModal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      box-sizing: border-box;
    }

    .auth-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 340px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .auth-card h2 {
      font-size: 1.2em;
      margin: 0 0 8px 0;
      color: var(--bntu-primary);
    }

    .auth-card p {
      font-size: 0.85em;
      color: var(--hint-color);
      margin-bottom: 16px;
    }

    .auth-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 1em;
      text-align: center;
      letter-spacing: 1px;
      outline: none;
      margin-bottom: 12px;
    }

    .auth-input:focus {
      border-color: var(--bntu-primary);
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--bntu-primary);
      color: #ffffff;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
    }

    .error-msg {
      color: #dc3545;
      font-size: 0.8em;
      margin-top: 8px;
      display: none;
    }

    /* Шапка приложения */
    .header {
      text-align: center;
      margin-bottom: 18px;
    }

    .header h1 {
      font-size: 1.3em;
      margin: 0 0 4px 0;
      font-weight: 700;
      color: var(--bntu-primary);
    }

    .header p {
      font-size: 0.85em;
      color: var(--hint-color);
      margin: 0;
    }

    .user-class-badge {
      display: inline-block;
      margin-top: 8px;
      background: rgba(166, 25, 46, 0.1);
      color: var(--bntu-primary);
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85em;
    }

    /* Дни недели */
    .days-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 16px;
      scrollbar-width: none;
    }
    .days-container::-webkit-scrollbar { display: none; }

    .day-btn {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 0.85em;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-btn.active {
      background: var(--bntu-primary);
      color: #ffffff;
      border-color: var(--bntu-primary);
      box-shadow: 0 2px 8px rgba(166, 25, 46, 0.3);
    }

    /* Карточки уроков */
    .lesson-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .lesson-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .lesson-subject {
      font-size: 1em;
      font-weight: 600;
    }

    .lesson-time {
      font-size: 0.8em;
      color: var(--hint-color);
      margin-top: 2px;
    }

    .lesson-room {
      background: rgba(166, 25, 46, 0.08);
      color: var(--bntu-primary);
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 0.8em;
      font-weight: 600;
    }

    .hw-container {
      margin-top: 8px;
      border-top: 1px dashed var(--border-color);
      padding-top: 8px;
    }

    .hw-input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid transparent;
      background: var(--input-bg);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85em;
      color: var(--text-color);
      outline: none;
      transition: all 0.2s ease;
    }

    .hw-input:focus {
      border-color: var(--bntu-primary);
      background: var(--card-bg);
    }

    .hw-input.has-value {
      background: rgba(166, 25, 46, 0.04);
      border-color: rgba(166, 25, 46, 0.2);
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--hint-color);
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <!-- Модальное окно авторизации -->
  <div id="authModal">
    <div class="auth-card">
      <h2>Лицей БНТУ</h2>
      <p>Введите ваш персональный идентификационный номер:</p>
      <input type="text" id="idInput" class="auth-input" placeholder="Например: 1001" />
      <button class="auth-btn" onclick="verifyId()">Войти</button>
      <div id="errorMsg" class="error-msg">Неверный код доступа!</div>
    </div>
  </div>

  <!-- Главный интерфейс -->
  <div class="header">
    <h1>Лицей БНТУ</h1>
    <p>Электронное расписание & ДЗ</p>
    <div id="classBadge" class="user-class-badge" style="display: none;"></div>
  </div>

  <!-- Дни недели -->
  <div class="days-container" id="daysTabs">
    <button class="day-btn active" onclick="setDay('monday', event)">Понедельник</button>
    <button class="day-btn" onclick="setDay('tuesday', event)">Вторник</button>
    <button class="day-btn" onclick="setDay('wednesday', event)">Среда</button>
    <button class="day-btn" onclick="setDay('thursday', event)">Четверг</button>
    <button class="day-btn" onclick="setDay('friday', event)">Пятница</button>
    <button class="day-btn" onclick="setDay('saturday', event)">Суббота</button>
  </div>

  <div id="schedule-container"></div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // БАЗА ДАННЫХ ИДЕНТИФИКАТОРОВ И ПРИВЯЗАННЫХ К НИМ КЛАССОВ
    const usersDatabase = {
      "1001": { classId: "10A", name: "10 «А» класс" },
      "1002": { classId: "10B", name: "10 «Б» класс" },
      "1101": { classId: "11A", name: "11 «А» класс" },
      "1102": { classId: "11B", name: "11 «Б» класс" }
    };

    // РАСПИСАНИЕ ПО КЛАССАМ
    const scheduleData = {
      "10A": {
        monday: [
          { id: "10A_mon_1", num: 1, time: "08:30 – 09:15", subject: "Физика", room: "302" },
          { id: "10A_mon_2", num: 2, time: "09:25 – 10:10", subject: "Математика", room: "205" },
          { id: "10A_mon_3", num: 3, time: "10:30 – 11:15", subject: "Белорусская литература", room: "410" },
          { id: "10A_mon_4", num: 4, time: "11:25 – 12:10", subject: "Химия", room: "104" }
        ],
        tuesday: [
          { id: "10A_tue_1", num: 1, time: "08:30 – 09:15", subject: "Английский язык", room: "215" },
          { id: "10A_tue_2", num: 2, time: "09:25 – 10:10", subject: "История Беларуси", room: "308" },
          { id: "10A_tue_3", num: 3, time: "10:30 – 11:15", subject: "Математика", room: "205" }
        ],
        wednesday: [
          { id: "10A_wed_1", num: 1, time: "08:30 – 09:15", subject: "Физика", room: "302" },
          { id: "10A_wed_2", num: 2, time: "09:25 – 10:10", subject: "География", room: "219" }
        ],
        thursday: [], friday: [], saturday: []
      },
      "10B": {
        monday: [
          { id: "10B_mon_1", num: 1, time: "08:30 – 09:15", subject: "Химия", room: "104" },
          { id: "10B_mon_2", num: 2, time: "09:25 – 10:10", subject: "Физика", room: "302" }
        ],
        tuesday: [], wednesday: [], thursday: [], friday: [], saturday: []
      },
      "11A": { monday: [], tuesday: [], wednesday: [], thursday: [], friday: [], saturday: [] },
      "11B": { monday: [], tuesday: [], wednesday: [], thursday: [], friday: [], saturday: [] }
    };

    let userClassId = null;
    let currentDay = 'monday';

    window.onload = function() {
      const savedClassId = localStorage.getItem('lyceum_user_class');
      const savedClassName = localStorage.getItem('lyceum_user_class_name');

      if (savedClassId && savedClassName) {
        userClassId = savedClassId;
        showClassBadge(savedClassName);
        document.getElementById('authModal').style.display = 'none';
        renderSchedule();
      }
    };

    function verifyId() {
      const enteredId = document.getElementById('idInput').value.trim();
      const errorMsg = document.getElementById('errorMsg');

      if (usersDatabase[enteredId]) {
        const userData = usersDatabase[enteredId];
        userClassId = userData.classId;

        // Сохраняем класс пользователя
        localStorage.setItem('lyceum_user_class', userData.classId);
        localStorage.setItem('lyceum_user_class_name', userData.name);

        showClassBadge(userData.name);
        document.getElementById('authModal').style.display = 'none';
        renderSchedule();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    function showClassBadge(className) {
      const badge = document.getElementById('classBadge');
      badge.textContent = `Класс: ${className}`;
      badge.style.display = 'inline-block';
    }

    function setDay(day, event) {
      currentDay = day;
      document.querySelectorAll('.day-btn').forEach(btn => btn.classList.remove('active'));
      if (event && event.target) {
        event.target.classList.add('active');
      }
      renderSchedule();
    }

    function saveHomework(lessonId, text) {
      const key = `hw_${lessonId}`;
      if (text.trim() === '') {
        localStorage.removeItem(key);
      } else {
        localStorage.setItem(key, text);
      }
      
      const inputEl = document.getElementById(`input_${lessonId}`);
      if (inputEl) {
        if (text.trim() !== '') {
          inputEl.classList.add('has-value');
        } else {
          inputEl.classList.remove('has-value');
        }
      }
    }

    function renderSchedule() {
      if (!userClassId) return;

      const container = document.getElementById('schedule-container');
      const classSchedule = scheduleData[userClassId] || {};
      const lessons = classSchedule[currentDay] || [];

      container.innerHTML = '';

      if (lessons.length === 0) {
        container.innerHTML = `<div class="empty-state">🎉 На этот день уроков нет или расписание не заполнено.</div>`;
        return;
      }

      lessons.forEach(l => {
        const savedHw = localStorage.getItem(`hw_${l.id}`) || '';
        const hasValueClass = savedHw ? 'has-value' : '';

        container.innerHTML += `
          <div class="lesson-card">
            <div class="lesson-header">
              <div>
                <div class="lesson-subject">${l.num}. ${l.subject}</div>
                <div class="lesson-time">⏰ ${l.time}</div>
              </div>
              <div class="lesson-room">каб. ${l.room}</div>
            </div>
            <div class="hw-container">
              <input 
                type="text" 
                id="input_${l.id}"
                class="hw-input ${hasValueClass}" 
                placeholder="✍️ Добавить домашнее задание / заметку..." 
                value="${savedHw}"
                oninput="saveHomework('${l.id}', this.value)"
              />
            </div>
          </div>
        `;
      });
    }
  </script>
</body>
</html>
