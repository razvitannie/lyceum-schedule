<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Электронный дневник • Лицей БНТУ</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg-color: var(--tg-theme-bg-color, #f8f9fa);
      --text-color: var(--tg-theme-text-color, #212529);
      --card-bg: var(--tg-theme-secondary-bg-color, #ffffff);
      --hint-color: var(--tg-theme-hint-color, #6c757d);
      --bntu-primary: #a6192e;
      --border-color: rgba(0, 0, 0, 0.08);
      --input-bg: rgba(0, 0, 0, 0.03);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    /* Модальное окно авторизации */
    #authModal {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0, 0, 0, 0.65);
      backdrop-filter: blur(6px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
      padding: 20px;
      box-sizing: border-box;
    }

    .auth-card {
      background: var(--card-bg);
      width: 100%;
      max-width: 340px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
      text-align: center;
      border: 1px solid var(--border-color);
    }

    .auth-card h2 {
      font-size: 1.2em;
      margin: 0 0 8px 0;
      color: var(--bntu-primary);
    }

    .auth-card p {
      font-size: 0.85em;
      color: var(--hint-color);
      margin-bottom: 16px;
    }

    .auth-input {
      width: 100%;
      box-sizing: border-box;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-color);
      font-size: 1em;
      text-align: center;
      letter-spacing: 1px;
      outline: none;
      margin-bottom: 12px;
    }

    .auth-input:focus {
      border-color: var(--bntu-primary);
    }

    .auth-btn {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: none;
      background: var(--bntu-primary);
      color: #ffffff;
      font-size: 0.95em;
      font-weight: 600;
      cursor: pointer;
    }

    .error-msg {
      color: #dc3545;
      font-size: 0.8em;
      margin-top: 8px;
      display: none;
    }

    /* Шапка приложения */
    .header {
      text-align: center;
      margin-bottom: 14px;
    }

    .header h1 {
      font-size: 1.3em;
      margin: 0 0 4px 0;
      font-weight: 700;
      color: var(--bntu-primary);
    }

    .header p {
      font-size: 0.85em;
      color: var(--hint-color);
      margin: 0;
    }

    .user-class-badge {
      display: inline-block;
      margin-top: 6px;
      background: rgba(166, 25, 46, 0.1);
      color: var(--bntu-primary);
      font-weight: 600;
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 0.85em;
    }

    /* Листалка недель четверти */
    .weeks-scroll {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 12px;
      scrollbar-width: none;
    }
    .weeks-scroll::-webkit-scrollbar { display: none; }

    .week-tab {
      flex: 0 0 auto;
      padding: 7px 12px;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--hint-color);
      font-size: 0.8em;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .week-tab.active {
      background: var(--bntu-primary);
      color: #ffffff;
      border-color: var(--bntu-primary);
      box-shadow: 0 2px 6px rgba(166, 25, 46, 0.3);
    }

    /* Дни недели */
    .days-container {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      margin-bottom: 14px;
      scrollbar-width: none;
    }
    .days-container::-webkit-scrollbar { display: none; }

    .day-btn {
      flex: 0 0 auto;
      padding: 8px 14px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
      background: var(--card-bg);
      color: var(--text-color);
      font-size: 0.85em;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .day-btn.active {
      background: var(--bntu-primary);
      color: #ffffff;
      border-color: var(--bntu-primary);
      box-shadow: 0 2px 8px rgba(166, 25, 46, 0.3);
    }

    /* Карточки уроков */
    .lesson-card {
      background: var(--card-bg);
      padding: 14px;
      border-radius: 12px;
      margin-bottom: 12px;
      border: 1px solid var(--border-color);
      box-shadow: 0 2px 6px rgba(0,0,0,0.02);
    }

    .lesson-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .lesson-subject {
      font-size: 1em;
      font-weight: 600;
    }

    .lesson-time {
      font-size: 0.8em;
      color: var(--hint-color);
      margin-top: 2px;
    }

    .lesson-room {
      background: rgba(166, 25, 46, 0.08);
      color: var(--bntu-primary);
      padding: 5px 9px;
      border-radius: 8px;
      font-size: 0.8em;
      font-weight: 600;
    }

    .hw-container {
      margin-top: 8px;
      border-top: 1px dashed var(--border-color);
      padding-top: 8px;
    }

    .hw-input {
      width: 100%;
      box-sizing: border-box;
      border: 1px solid transparent;
      background: var(--input-bg);
      border-radius: 8px;
      padding: 8px 10px;
      font-size: 0.85em;
      color: var(--text-color);
      outline: none;
      transition: all 0.2s ease;
    }

    .hw-input:focus {
      border-color: var(--bntu-primary);
      background: var(--card-bg);
    }

    .hw-input.has-value {
      background: rgba(166, 25, 46, 0.04);
      border-color: rgba(166, 25, 46, 0.2);
    }

    .empty-state {
      text-align: center;
      padding: 30px 20px;
      color: var(--hint-color);
      font-size: 0.9em;
    }
  </style>
</head>
<body>

  <!-- Модальное окно авторизации -->
  <div id="authModal">
    <div class="auth-card">
      <h2>Лицей БНТУ</h2>
      <p>Введите ваш персональный идентификационный номер:</p>
      <input type="text" id="idInput" class="auth-input" placeholder="Например: 1001" />
      <button class="auth-btn" onclick="verifyId()">Войти</button>
      <div id="errorMsg" class="error-msg">Неверный код доступа!</div>
    </div>
  </div>

  <!-- Шапка приложения -->
  <div class="header">
    <h1>Лицей БНТУ</h1>
    <p>Электронный дневник</p>

  <!-- Листалка недель четверти -->
  <div class="weeks-scroll" id="weeksContainer">
    <button class="week-tab active" onclick="setWeek(1, event)">Неделя 1</button>
    <button class="week-tab" onclick="setWeek(2, event)">Неделя 2</button>

    <button class="week-tab" onclick="setWeek(4, event)">Неделя 4</button>
    <button class="week-tab" onclick="setWeek(5, event)">Неделя 5</button>
    <button class="week-tab" onclick="setWeek(6, event)">Неделя 6</button>
    <button class="week-tab" onclick="setWeek(7, event)">Неделя 7</button>
    <button class="week-tab" onclick="setWeek(8, event)">Неделя 8</button>
  </div>

  <!-- Дни недели -->
  <div class="days-container" id="daysTabs">
    <button class="day-btn active" onclick="setDay('monday', event)">Понедельник</button>
    <button class="day-btn" onclick="setDay('tuesday', event)">Вторник</button>
    <button class="day-btn" onclick="setDay('wednesday', event)">Среда</button>
    <button class="day-btn" onclick="setDay('thursday', event)">Четверг</button>
    <button class="day-btn" onclick="setDay('friday', event)">Пятница</button>
    <button class="day-btn" onclick="setDay('saturday', event)">Суббота</button>
  </div>

  <div id="schedule-container"></div>
